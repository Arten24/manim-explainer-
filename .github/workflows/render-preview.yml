name: Manim render previews

on:
  workflow_dispatch:
  push:
    branches: [main, "arena/**"]
    paths:
      - "examples/**"
      - "src/quonitron_manim/**"
      - "tests/**"
      - "scripts/verify_render_artifacts.py"
      - "catalog/**"
      - "manim.cfg"
      - "pyproject.toml"
      - "uv.lock"
      - ".devcontainer/**"
      - ".github/workflows/render-preview.yml"

permissions:
  contents: read

jobs:
  render-parts-1-4:
    name: Render and verify Parts 1–4
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Linux rendering libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libcairo2-dev libpango1.0-dev ffmpeg pkg-config python3-dev \
            fonts-dejavu-core
      - name: Report native renderer versions
        run: |
          ffmpeg_version="$(ffmpeg -version | sed -n '1p')"
          cairo_version="$(pkg-config --modversion cairo)"
          pango_version="$(pkg-config --modversion pango)"
          pangocairo_version="$(pkg-config --modversion pangocairo)"
          {
            echo "## Native rendering dependencies"
            echo "- $ffmpeg_version"
            echo "- Cairo $cairo_version"
            echo "- Pango $pango_version"
            echo "- PangoCairo $pangocairo_version"
            echo "- Font samples:"
            fc-list | sed -n '1,3p' | sed 's/^/  - /'
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Install pinned uv and sync locked render dependencies
        run: |
          python -m pip install --disable-pip-version-check "uv==0.13.1"
          uv sync --locked --python 3.11 --extra dev --extra render --extra notebook
      - name: Verify real Manim, Cairo, Pango, and FFmpeg
        run: |
          command -v ffmpeg
          command -v ffprobe
          uv run --locked python - <<'PY'
          import os
          import manim
          from quonitron_manim.core.manim_compat import cairo_usable, manimpango_usable

          assert cairo_usable()[0], cairo_usable()[1]
          assert manimpango_usable()[0], manimpango_usable()[1]
          versions = [
              f"Manim {manim.__version__}",
              f"{cairo_usable()[1]}",
              f"Pango {manimpango_usable()[1]}",
          ]
          print("\n".join(versions))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write("\n## Python rendering stack\n")
              summary.write("\n".join(f"- {version}" for version in versions))
              summary.write("\n")
          PY
      - name: Render existing Part 1–4 demos with Cairo
        run: |
          mkdir -p .renders
          set +e
          uv run --locked python -m pytest --basetemp=.renders/tests -m render -vv --tb=short 2>&1 | tee .renders/render-tests.log
          render_status=${PIPESTATUS[0]}
          if [ "$render_status" -ne 0 ]; then
            {
              echo "## Render test diagnostics (exit $render_status)"
              echo '```text'
              tail -n 200 .renders/render-tests.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$render_status"
      - name: Probe MP4s and extract midpoint frames
        run: |
          set +e
          uv run --locked python scripts/verify_render_artifacts.py \
            .renders/tests --frames-dir .renders/frames --min-videos 4 \
            2>&1 | tee .renders/probe.log
          probe_status=${PIPESTATUS[0]}
          if [ "$probe_status" -ne 0 ]; then
            failure_summary="$(tail -n 40 .renders/probe.log | tr '\n' ' ' | cut -c 1-4000)"
            {
              echo "## MP4 verification failure (exit $probe_status)"
              echo
              echo '```text'
              cat .renders/probe.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=MP4 verification failed::$failure_summary"
          else
            while IFS= read -r line; do
              case "$line" in
                PASS:*) echo "::notice title=Verified render::$line" ;;
              esac
            done < .renders/probe.log
          fi
          exit "$probe_status"
      - name: Upload rendered videos and inspection frames
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quonitron-part-1-4-render-previews
          path: |
            .renders/tests/**/media/videos/*/480p15/*.mp4
            .renders/frames/*.jpg
            .renders/render-tests.log
            .renders/probe.log
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14
