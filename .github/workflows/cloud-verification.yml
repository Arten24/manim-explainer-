name: Cloud render verification
on:
  push:
    branches: ['arena/**']
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'examples/**'
      - 'notebooks/**'
      - 'requirements-render.txt'
      - 'pyproject.toml'
      - '.github/workflows/cloud-verification.yml'
  workflow_dispatch:
concurrency:
  group: cloud-verification-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  checks: write
jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Native dependencies
        run: |
          sudo apt-get update --error-on=any
          sudo apt-get install -y --no-install-recommends libcairo2-dev libpango1.0-dev pkg-config python3-dev ffmpeg fonts-dejavu-core
      - name: Reference Python stack
        run: |
          python -m pip install -r requirements-render.txt
          python -m pip install --no-deps -e .
          python -m pip check
      - name: Syntax, catalog, dependency functionality
        run: |
          python -m compileall -q src scripts examples tests
          python scripts/validate_catalog.py
          python scripts/verify_environment.py --json media/cloud-verification/dependencies.json
      - name: All actual preview renders, decode and frames
        if: ${{ !cancelled() }}
        run: python scripts/verify_renders.py
      - name: Intended-quality smoke
        if: ${{ !cancelled() }}
        run: python scripts/verify_renders.py --only themed --quality production
      - name: Publish preliminary render evidence
        if: ${{ !cancelled() }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/publish_ci_evidence.py --preliminary
      - name: Full suite (render failures and skips are reported)
        run: python -m pytest -ra --timeout=180 --durations=15 --junitxml=media/cloud-verification/tests.xml
      - name: Actual notebook backend execution
        if: ${{ !cancelled() }}
        run: |
          mkdir -p media/cloud-verification
          set -o pipefail
          python scripts/execute_environment_notebook.py 2>&1 | tee media/cloud-verification/notebook.log
      - name: Publish API-readable evidence (no artifact-host dependency)
        if: ${{ always() }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/publish_ci_evidence.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cloud-render-evidence
          path: media/
          retention-days: 7
          if-no-files-found: warn
