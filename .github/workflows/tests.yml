name: Tests

on:
  push:
    branches: [main, "arena/**"]
  pull_request:

permissions:
  contents: read
  checks: write

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install unit-test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install jsonschema pytest
          pip install -e .
      - name: Validate catalog and run unit tests
        run: |
          python scripts/validate_catalog.py
          pytest -m "not render"

  render:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Manim system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libcairo2-dev libpango1.0-dev ffmpeg pkg-config python3-dev fonts-dejavu-core
      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-render.txt
          pip install --no-deps -e .
      - name: Low-quality demo render test
        run: pytest -m render --timeout=180 --junitxml=media/cloud-verification/tests.xml
      - name: Publish API-readable renderer test results
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/publish_ci_evidence.py --tests-only
