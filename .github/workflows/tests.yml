name: Tests

on:
  push:
    branches: [main, "arena/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    name: Unit and notebook checks (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pinned uv
        run: python -m pip install --disable-pip-version-check "uv==0.13.1"
      - name: Sync locked unit and notebook dependencies
        run: uv sync --locked --python "${{ matrix.python-version }}" --extra dev --extra notebook
      - name: Check Python syntax
        run: uv run --locked python -m compileall -q src scripts examples tests
      - name: Validate component catalog
        run: uv run --locked python scripts/validate_catalog.py
      - name: Run unit and data-validation tests
        run: uv run --locked python -m pytest -m "not render" -vv
