[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quonitron-manim-master-library"
version = "0.5.0"
description = "An extensible, reusable Manim animation component library, JSON catalog, subtitle toolkit, scene templates, and automated quality checks for educational video production."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Nibir Nath" }]
keywords = ["manim", "animation", "education", "catalog", "subtitles"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Video",
  "Topic :: Education",
]
dependencies = [
  "jsonschema>=4.20",
]

[project.optional-dependencies]
render = [
  "manim>=0.18.1,<1.0",
]
dev = [
  "pytest>=8.0,<10",
  "jsonschema>=4.20,<5",
]
notebook = [
  "ipykernel>=6.29,<8",
  "nbclient>=0.10,<0.12",
  "nbformat>=5.9,<6",
]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
markers = [
  "render: tests that require Cairo, Pango, FFmpeg, and Manim",
]

[tool.ruff]
line-length = 100
target-version = "py310"
