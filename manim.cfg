[CLI]
# QUONITRON defaults. CLI flags such as -ql still override pixel size and fps.
notify_outdated_version = False
preview = False
verbosity = INFO
background_color = #0D1117
background_opacity = 1
media_dir = ./media
frame_rate = 30
pixel_height = 1080
pixel_width = 1920
disable_caching = True
renderer = cairo
format = mp4
